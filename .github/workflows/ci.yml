name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/tracefork
      - name: Tests + coverage
        run: uv run pytest -q --cov --cov-report=term-missing --junit-xml=junit.xml
      - name: Executed-evidence CI sentinel
        run: uv run python scripts/check_executed_evidence.py
      - name: Self-validation regression gate
        run: uv run tracefork validate --check
      - name: Build distribution
        run: uv build
      - name: Twine check
        run: uv run --with twine twine check dist/*
      - name: Wheel install smoke test
        run: uv run python scripts/wheel_smoke.py --wheel dist/tracefork-*.whl
