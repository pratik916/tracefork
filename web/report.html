<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tracefork — time-travel debugger</title>
<!-- TF:tokens -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* color tokens — dark theme (default, GitHub-dark) */
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #838b95; --green: #3fb950;
    --blue: #58a6ff; --orange: #f0883e; --purple: #d2a8ff;
    --red: #f85149; --yellow: #e3b341;
    /* semantic badge backgrounds (tags, blame/shapley/evidence badges, notes) */
    --badge-pass-bg: #1a3a1a; --badge-fail-bg: #3a1a1a;
    --badge-info-bg: #1a2a3a; --badge-warn-bg: #3a3010;
    --badge-redacted-bg: #3a2a10;
    /* type tokens — --font-ui for chrome, --font-mono for code/data */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --text-xs: 11px; --text-sm: 12px; --text-md: 13px; --text-lg: 15px;
    /* spacing scale, radius, focus ring */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    --radius: 6px;
    --focus-ring: 2px solid var(--blue);
    /* tells the UA to render native controls (range sliders, scrollbars,
       form-field chrome) in dark UI, matching this theme -- overridden to
       'light' below when [data-theme="light"] is active */
    color-scheme: dark;
  }
  [data-theme="light"] {
    /* light theme (GitHub-light-inspired) — stamped on <html> by the theme boot */
    --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --green: #1a7f37;
    --blue: #0969da; --orange: #bc4c00; --purple: #8250df;
    --red: #d1242f; --yellow: #9a6700;
    --badge-pass-bg: #dafbe1; --badge-fail-bg: #ffebe9;
    --badge-info-bg: #ddf4ff; --badge-warn-bg: #fff8c5;
    --badge-redacted-bg: #fff1e5;
    color-scheme: light;
  }
  :focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: var(--text-md); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: var(--text-lg); color: var(--green); }
  header .run-meta { color: var(--muted); font-size: var(--text-xs); }
  .theme-toggle { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text);
                  font-family: inherit; font-size: var(--text-sm); padding: 1px 7px; cursor: pointer;
                  border-radius: 3px; line-height: 1.3; }
  .theme-toggle:hover { border-color: var(--blue); }

  /* Workbench shell: 3-zone grid — collapsible LEFT RAIL (Timeline), CENTER
     exchange detail, collapsible RIGHT RAIL (tabbed Blame | Forks | Cost). */
  .layout { display: grid; grid-template-columns: auto 1fr auto; height: calc(100vh - 45px); }
  .panel { overflow-y: auto; }
  .panel-header { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
                  font-size: var(--text-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .rail { display: flex; min-height: 0; }
  .rail-left { width: 280px; border-right: 1px solid var(--border); }
  .rail-right { width: 320px; border-left: 1px solid var(--border); }
  .rail.collapsed { width: 36px; }
  .rail-body { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .rail.collapsed .rail-body { display: none; }
  .rail-body > .panel { flex: 1; min-height: 0; }
  .rail-toggle { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted);
                 font-family: inherit; font-size: var(--text-xs); padding: 0 6px; cursor: pointer;
                 border-radius: 3px; line-height: 1.4; }
  .rail-toggle:hover { color: var(--text); border-color: var(--blue); }
  .rail-expand { display: none; width: 36px; flex-direction: column; align-items: center; gap: var(--sp-2);
                 padding: var(--sp-3) 0; background: var(--surface); border: none; color: var(--muted);
                 cursor: pointer; font-family: inherit; }
  .rail.collapsed .rail-expand { display: flex; }
  .rail-expand:hover { color: var(--text); }
  .rail-expand-label { writing-mode: vertical-rl; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .rail-tabs { flex: 0 0 auto; display: flex; align-items: center; background: var(--surface);
               border-bottom: 1px solid var(--border); }
  .rail-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted);
              font-family: inherit; font-size: var(--text-xs); padding: 8px 12px 6px; cursor: pointer;
              text-transform: uppercase; letter-spacing: 0.05em; }
  .rail-tab:hover { color: var(--text); }
  .rail-tab.active { color: var(--text); border-bottom-color: var(--blue); }
  .rail-tabpanel { flex: 1; min-height: 0; }
  .rail-tabpanel[hidden] { display: none; }
  #timeline-panel .panel-header { display: flex; align-items: center; gap: var(--sp-2); }

  /* Left rail — Timeline */
  #timeline-scrubber { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .scrubber-controls { display: flex; align-items: center; gap: 8px; }
  .scrubber-play-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text);
             font-family: inherit; font-size: var(--text-xs); padding: 3px 8px; cursor: pointer; border-radius: 3px; }
  .scrubber-play-btn:hover { border-color: var(--blue); }
  .scrubber-slider { flex: 1; }
  .scrubber-track { position: relative; height: 16px; margin-top: 6px; }
  .scrubber-tick { position: absolute; top: 0; width: 2px; height: 10px; background: var(--muted); cursor: pointer; }
  .scrubber-tick.active { background: var(--blue); height: 14px; }
  .exchange-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .exchange-item:hover, .exchange-item.active { background: var(--surface); }
  .exchange-item .step { font-size: 10px; color: var(--muted); }
  .exchange-item .role { font-size: var(--text-sm); margin: 3px 0; }
  .role-user { color: var(--blue); }
  .role-assistant { color: var(--purple); }
  .role-tool { color: var(--orange); }
  .exchange-item .preview { font-size: var(--text-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blame-badge { float: right; font-size: 10px; padding: 2px 6px; border-radius: 10px; background: var(--badge-pass-bg); color: var(--green); }
  .blame-badge.high { background: var(--badge-fail-bg); color: var(--red); }

  /* Shapley necessity/sufficiency quadrant badge, inline in the Timeline
     panel's per-exchange row next to the blame flip-rate badge -- no new
     panel. */
  .shapley-badge { float: right; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }
  .shapley-badge.critical { background: var(--badge-fail-bg); color: var(--red); }
  .shapley-badge.necessary { background: var(--badge-warn-bg); color: var(--yellow); }
  .shapley-badge.sufficient { background: var(--badge-info-bg); color: var(--blue); }
  .shapley-badge.inert { background: var(--surface); color: var(--muted); }

  /* Center — Exchange Detail */
  .detail-empty { padding: 40px; color: var(--muted); text-align: center; }
  .detail-section { padding: 14px; border-bottom: 1px solid var(--border); }
  .detail-section h3 { font-size: var(--text-xs); color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
  pre { background: var(--surface); padding: 10px; border-radius: 4px; overflow-x: auto; font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.6; }
  .key { color: var(--blue); }
  .string { color: var(--green); }
  .number { color: var(--yellow); }

  /* Right rail — Blame tab */
  .blame-empty { padding: 40px; color: var(--muted); text-align: center; }
  .blame-row { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .blame-rank { width: 20px; color: var(--muted); font-size: var(--text-xs); }
  .blame-info { flex: 1; }
  .blame-step { font-size: var(--text-sm); }
  .blame-ci { font-size: 10px; color: var(--muted); }
  .blame-bar-wrap { width: 80px; }
  .blame-bar { height: 6px; background: var(--green); border-radius: 3px; }
  .blame-bar.decisive { background: var(--red); }
  .blame-rate { font-size: var(--text-xs); text-align: right; min-width: 50px; }
  .blame-rate.decisive { color: var(--red); font-weight: bold; }
  .blame-header-row { padding: 6px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
                       display: flex; gap: 8px; font-size: 10px; color: var(--muted); }

  /* Selected / support-evidence / external-anchor vocabulary */
  .evidence-badge { font-size: 9px; padding: 1px 5px; border-radius: 8px; margin-left: 6px; }
  .evidence-badge.selected { background: var(--badge-fail-bg); color: var(--red); }
  .evidence-badge.support { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .anchor-row { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: var(--text-xs); }
  .anchor-row .anchor-run { color: var(--blue); }
  .anchor-empty { padding: 12px 14px; color: var(--muted); font-size: var(--text-xs); }

  .loading { padding: 40px; text-align: center; color: var(--muted); }
  .error { padding: 20px; color: var(--red); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-left: 6px; }
  .tag-live { background: var(--badge-pass-bg); color: var(--green); }
  .tag-static { background: var(--badge-info-bg); color: var(--blue); }

  /* Replay-report / divergence diagnostics */
  .tag-pass { background: var(--badge-pass-bg); color: var(--green); cursor: default; }
  .tag-fail { background: var(--badge-fail-bg); color: var(--red); cursor: pointer; }
  .tag-fail:hover { text-decoration: underline; }

  /* Boundary/provenance/redaction trust badges (see renderProvenanceBadges) --
     verified boundary reuses .tag-pass above; forensic-only and redacted-content
     are distinct warning tags, never a pass/fail input. */
  .tag-warn { background: var(--badge-warn-bg); color: var(--yellow); cursor: default; }
  .tag-redacted { background: var(--badge-redacted-bg); color: var(--orange); cursor: default; }
  .nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text);
             font-family: inherit; font-size: var(--text-xs); padding: 3px 8px; cursor: pointer; border-radius: 3px; }
  .nav-btn:hover { border-color: var(--blue); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .detail-nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
                border-bottom: 1px solid var(--border); background: var(--surface); }
  .diverge-note { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
  .diverge-note.real { background: var(--badge-fail-bg); color: var(--red); }
  .diverge-note.tolerated { background: var(--badge-warn-bg); color: var(--yellow); }
  .diff-table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); margin-top: 8px; }
  .diff-table th, .diff-table td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; word-break: break-all; }
  .diff-table th { background: var(--surface); color: var(--muted); font-weight: normal; }
  .diff-path { color: var(--blue); font-family: var(--font-mono); }
  .diff-recorded { color: var(--red); }
  .diff-live { color: var(--green); }
  .trust-flags { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .trust-warn { color: var(--yellow); }

  /* Click-to-fork inline UI */
  .fork-textarea { width: 100%; font-family: inherit; font-size: var(--text-xs); background: var(--surface);
                    color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px; }
  .fork-row { margin-top: 6px; display: flex; gap: 8px; align-items: center; }

  /* Right rail — Forks tab (Fork Tree) */
  .forktree-empty { padding: 40px; color: var(--muted); text-align: center; }
  .forktree-svg { display: block; margin: 12px auto; }
  .forktree-node { fill: var(--blue); cursor: pointer; }
  .forktree-node:hover { fill: var(--orange); }
  .forktree-node.forktree-root { fill: var(--green); cursor: default; }
  .forktree-edge { stroke: var(--border); stroke-width: 2; }
  .forktree-label { fill: var(--text); font-size: var(--text-xs); font-family: var(--font-mono); }
  .forktree-root-label { fill: var(--green); }
  .forktree-desc { fill: var(--muted); font-size: 10px; font-family: var(--font-mono); }

  /* Causal heatmap overlay on fork-tree nodes: a branch's divergence_step
     cross-referenced against data.causal_edges.
     `-responsible` (blame's FDR-selected set) wins the fill color;
     `-necessary`/`-sufficient` (Shapley) are stroke-only encodings so both
     can be visible on the same node at once. */
  .forktree-node-responsible { fill: var(--red); }
  .forktree-node-necessary { stroke: var(--yellow); stroke-width: 3; }
  .forktree-node-sufficient { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2,2; }

  /* Right rail — Cost tab (Cost Profile) */
  .cost-empty { padding: 40px; color: var(--muted); text-align: center; }
  .cost-section h3 { font-size: var(--text-xs); color: var(--muted); margin: 12px 14px 4px; text-transform: uppercase; }
  .cost-row { padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-xs); }
  .cost-row .cost-name { color: var(--text); }
  .cost-row .cost-meta { color: var(--muted); font-size: 10px; }
  .cost-row .cost-usd { color: var(--green); text-align: right; min-width: 60px; }
  .cost-total { padding: 10px 14px; font-size: var(--text-sm); font-weight: bold; border-top: 1px solid var(--border);
                display: flex; justify-content: space-between; }

  /* ── Responsive breakpoints ──────────────────────────────────────────────
     Two breakpoints, kept at the SAME px values across report.html/
     runs.html/session_report.html so the three templates reflow at
     consistent widths: 860px (tablet -- report.html's 3-zone workbench
     shell stops fitting side-by-side) and 560px (phone -- header/toolbar
     rows get too cramped to stay on one line). */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 32vh) minmax(220px, 1fr) minmax(160px, 32vh); }
    .rail-left, .rail-right { width: 100%; }
    .rail-left { border-right: none; border-bottom: 1px solid var(--border); }
    .rail-right { border-left: none; border-top: 1px solid var(--border); }
    .rail.collapsed { width: 100%; height: 40px; }
    .rail.collapsed .rail-expand { flex-direction: row; width: 100%; height: 40px; padding: 0 var(--sp-3); }
    .rail-expand-label { writing-mode: horizontal-tb; }
  }
  @media (max-width: 560px) {
    header { flex-wrap: wrap; row-gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); }
    header .run-meta { order: 10; flex-basis: 100%; }
    .theme-toggle { margin-left: 0; }
    .layout { grid-template-rows: minmax(140px, 30vh) minmax(200px, 1fr) minmax(140px, 30vh); }
    .blame-bar-wrap { display: none; }
  }
</style>
<!-- TF:theme-boot -->
<script>
// Zero-FOUC theme boot: resolve the persisted theme (localStorage
// "tracefork-theme", JSON-encoded by the toggle) — or, on first visit,
// prefers-color-scheme — and stamp it on <html data-theme> before first
// paint. Default dark. Never throws (file:// / privacy modes can make
// localStorage or matchMedia unavailable).
(function () {
  var theme = 'dark';
  try {
    var raw = localStorage.getItem('tracefork-theme');
    if (raw !== null) {
      try { theme = JSON.parse(raw); } catch (e) { theme = raw; }
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      theme = 'light';
    }
  } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') theme = 'dark';
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>
<header>
  <h1>tracefork</h1>
  <span class="run-meta" id="run-meta">loading…</span>
  <span class="tag" id="mode-tag"></span>
  <span class="tag" id="replay-tag" onclick="jumpToDivergence()" title="click to rewind to the diverging step"></span>
  <span class="tag" id="boundary-tag"></span>
  <span class="tag" id="redacted-tag"></span>
  <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="toggle color theme" title="toggle color theme">◐</button>
</header>
<!-- TF:shell -->
<div class="layout" id="workbench">
  <nav class="rail rail-left" id="rail-left" role="navigation" aria-label="Timeline rail">
    <div class="rail-body">
      <div class="panel" id="timeline-panel">
        <div class="panel-header">Timeline
          <button type="button" class="rail-toggle" id="rail-left-toggle" onclick="toggleRail('left')" aria-label="collapse timeline rail" aria-expanded="true" title="collapse timeline rail">«</button>
        </div>
        <div id="timeline-scrubber"></div>
        <div id="timeline-content"><div class="loading">loading…</div></div>
      </div>
    </div>
    <button type="button" class="rail-expand" id="rail-left-expand" onclick="toggleRail('left')" aria-label="expand timeline rail" title="expand timeline rail"><span aria-hidden="true">»</span><span class="rail-expand-label">Timeline</span></button>
  </nav>
  <div class="panel" id="detail-panel">
    <div class="panel-header">Exchange Detail</div>
    <div id="detail-content"><div class="detail-empty">← select an exchange</div></div>
  </div>
  <nav class="rail rail-right" id="rail-right" role="navigation" aria-label="Analysis rail">
    <div class="rail-body">
      <div class="rail-tabs" role="tablist" aria-label="Analysis panels">
        <button type="button" class="rail-tab active" id="rail-tab-blame" role="tab" data-tab="blame" aria-selected="true" aria-controls="blame-panel" onclick="selectRailTab('blame')">Blame</button>
        <button type="button" class="rail-tab" id="rail-tab-forks" role="tab" data-tab="forks" aria-selected="false" aria-controls="forktree-panel" onclick="selectRailTab('forks')">Forks</button>
        <button type="button" class="rail-tab" id="rail-tab-cost" role="tab" data-tab="cost" aria-selected="false" aria-controls="cost-panel" onclick="selectRailTab('cost')">Cost</button>
        <button type="button" class="rail-toggle" id="rail-right-toggle" onclick="toggleRail('right')" aria-label="collapse analysis rail" aria-expanded="true" title="collapse analysis rail">»</button>
      </div>
      <div class="panel rail-tabpanel" id="blame-panel" role="tabpanel" data-tabpanel="blame" aria-labelledby="rail-tab-blame">
        <div class="panel-header">Blame</div>
        <div id="blame-content"><div class="blame-empty">run tracefork blame to populate</div></div>
      </div>
      <div class="panel rail-tabpanel" id="forktree-panel" role="tabpanel" data-tabpanel="forks" aria-labelledby="rail-tab-forks" hidden>
        <div class="panel-header">Fork Tree</div>
        <div id="forktree-content"><div class="loading">loading…</div></div>
      </div>
      <div class="panel rail-tabpanel" id="cost-panel" role="tabpanel" data-tabpanel="cost" aria-labelledby="rail-tab-cost" hidden>
        <div class="panel-header">Cost Profile</div>
        <div id="cost-content"><div class="loading">loading…</div></div>
      </div>
    </div>
    <button type="button" class="rail-expand" id="rail-right-expand" onclick="toggleRail('right')" aria-label="expand analysis rail" title="expand analysis rail"><span aria-hidden="true">«</span><span class="rail-expand-label">Analysis</span></button>
  </nav>
</div>

<script>
// ── data source ───────────────────────────────────────────────────────────
let DATA = null;

// ── TF foundation namespace ────────────────────────────────────────────────
// Zero-dependency building blocks for the workbench UI. Purely additive: the
// existing globals and inline onclick handlers keep working exactly as before.
const TF = {
  // TF.esc / TF.escAttr — the file's existing escape()/escapeAttr(); every
  // interpolated untrusted value goes through one of these (function
  // declarations hoist, so these refs resolve even though they're below).
  esc: escape,
  escAttr: escapeAttr,
  // TF.h(tag, attrs, ...children) — hyperscript DOM builder: attributes via
  // setAttribute ('class' → className, on* function → addEventListener),
  // children appended as text nodes (never innerHTML) unless already Nodes.
  h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === null || v === undefined) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, String(v));
    });
    const append = (child) => {
      if (child === null || child === undefined) return;
      if (Array.isArray(child)) { child.forEach(append); return; }
      el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
    };
    children.forEach(append);
    return el;
  },
  // TF.store — localStorage JSON get/set, try/catch-wrapped (file:// and
  // privacy modes can make localStorage throw); a miss/error reads as the
  // fallback, never an exception.
  store: {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
    },
  },
  // TF.keys — keyboard manager: register({key: handler}) installs ONE shared
  // document keydown listener that ignores input/textarea/select focus.
  keys: {
    _map: {},
    _installed: false,
    register(map) {
      Object.assign(this._map, map || {});
      this._install();
    },
    _install() {
      if (this._installed) return;
      this._installed = true;
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
        const handler = this._map[e.key];
        if (typeof handler === 'function') handler(e);
      });
    },
  },
};

// ── theme toggle ────────────────────────────────────────────────────────────
// Flips <html data-theme> (swapping in the [data-theme="light"] token block),
// persists to localStorage "tracefork-theme" (the key the zero-FOUC head boot
// reads), and re-syncs the header button. ◐ is the pre-JS placeholder glyph.
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  TF.store.set('tracefork-theme', next);
  _syncThemeToggle();
}

function _syncThemeToggle() {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const light = document.documentElement.dataset.theme === 'light';
  btn.textContent = light ? '🌙' : '☀';
  const label = light ? 'switch to dark theme' : 'switch to light theme';
  btn.setAttribute('aria-label', label);
  btn.title = label;
}

// ── workbench shell: collapsible rails + right-rail tabs ────────────────────
// Pure re-parenting of the existing panels — every render function below still
// targets the same element ids and runs regardless of rail/tab visibility.
const _RAIL_TABS = ['blame', 'forks', 'cost'];

function _setRailCollapsed(side, collapsed) {
  const rail = document.getElementById('rail-' + side);
  if (!rail) return;
  rail.classList.toggle('collapsed', collapsed);
  const toggle = document.getElementById('rail-' + side + '-toggle');
  if (toggle) toggle.setAttribute('aria-expanded', String(!collapsed));
}

function toggleRail(side) {
  const rail = document.getElementById('rail-' + side);
  if (!rail) return;
  const collapsed = !rail.classList.contains('collapsed');
  _setRailCollapsed(side, collapsed);
  TF.store.set('tracefork-rail-' + side, collapsed);
}

function selectRailTab(name, persist) {
  if (_RAIL_TABS.indexOf(name) === -1) name = 'blame';
  document.querySelectorAll('#rail-right .rail-tab').forEach(tab => {
    const active = tab.getAttribute('data-tab') === name;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', String(active));
  });
  document.querySelectorAll('#rail-right .rail-tabpanel').forEach(panel => {
    panel.hidden = panel.getAttribute('data-tabpanel') !== name;
  });
  if (persist !== false) TF.store.set('tracefork-rail-tab', name);
}

// Restore persisted shell state and sync the theme glyph. Runs at script parse
// (the DOM above is already parsed) — independent of the async data boot so the
// shell is correct even when data loading fails.
(function initShell() {
  _setRailCollapsed('left', TF.store.get('tracefork-rail-left', false) === true);
  _setRailCollapsed('right', TF.store.get('tracefork-rail-right', false) === true);
  selectRailTab(TF.store.get('tracefork-rail-tab', 'blame'), false);
  _syncThemeToggle();
})();

async function loadData() {
  if (window.__TRACEFORK_DATA__) {
    // static mode: data injected at report-generation time
    document.getElementById('mode-tag').textContent = 'static';
    document.getElementById('mode-tag').className = 'tag tag-static';
    return window.__TRACEFORK_DATA__;
  }
  if (window.__TRACEFORK_SERVER_URL__ !== undefined) {
    // live mode: fetch from the serving origin (empty base → same-origin, any port)
    document.getElementById('mode-tag').textContent = 'live';
    document.getElementById('mode-tag').className = 'tag tag-live';
    const url = window.__TRACEFORK_SERVER_URL__;
    const runId = new URLSearchParams(location.search).get('run_id');
    const resp = await fetch(`${url}/api/run/${runId}`);
    if (!resp.ok) throw new Error(`server ${resp.status}: run not found`);
    return resp.json();
  }
  throw new Error('No data source configured');
}

// ── render ─────────────────────────────────────────────────────────────────
function renderTimeline(data) {
  const blame = data.blame || {};
  const divergence = (data.replay && data.replay.divergence) || null;
  const html = data.exchanges.map((ex, i) => {
    const flipRate = blame[i] ? blame[i].flip_rate : null;
    const isDecisive = flipRate !== null && flipRate >= 0.7;
    const badgeHtml = flipRate !== null
      ? `<span class="blame-badge${isDecisive ? ' high' : ''}">${Math.round(flipRate*100)}%</span>`
      : '';
    const divergeHtml = divergence && divergence.step_index === i
      ? `<span class="blame-badge high" title="replay diverged here">⚡ diverged</span>`
      : '';
    const shapleyHtml = shapleyQuadrantHtml((data.shapley || {})[i]);
    const roleClass = ex.role === 'user' ? 'role-user' : ex.role === 'assistant' ? 'role-assistant' : 'role-tool';
    return `<div class="exchange-item" data-i="${i}" onclick="selectExchange(${i})">
      ${divergeHtml}${badgeHtml}${shapleyHtml}
      <div class="step">exchange ${i}</div>
      <div class="role ${roleClass}">${escape(ex.role || 'unknown')}</div>
      <div class="preview">${escape(ex.preview || '')}</div>
    </div>`;
  }).join('');
  document.getElementById('timeline-content').innerHTML = html;
}

// Shapley necessity/sufficiency quadrant badge: reuses blame.py's already-shipped
// ShapleyResult fields (necessity/sufficiency
// booleans + their scores), the same shape store.py's causal_edges rows
// carry. `info` is `undefined` for any exchange with no shapley data (the
// default, empty `data.shapley` case) -- renders nothing, byte-identical to
// before this feature existed.
function shapleyQuadrantHtml(info) {
  if (!info) return '';
  const necessity = !!info.necessity;
  const sufficiency = !!info.sufficiency;
  let label, cls;
  if (necessity && sufficiency) { label = 'N+S'; cls = 'critical'; }
  else if (necessity) { label = 'N'; cls = 'necessary'; }
  else if (sufficiency) { label = 'S'; cls = 'sufficient'; }
  else { label = '·'; cls = 'inert'; }
  const nScore = info.necessity_score != null ? Number(info.necessity_score).toFixed(3) : '?';
  const sScore = info.sufficiency_score != null ? Number(info.sufficiency_score).toFixed(3) : '?';
  const title = `necessity=${necessity} (${nScore}) · sufficiency=${sufficiency} (${sScore})`;
  return `<span class="shapley-badge ${cls}" title="${escapeAttr(title)}">${label}</span>`;
}

function renderReplayBadge(data) {
  const el = document.getElementById('replay-tag');
  const replay = data.replay;
  if (!replay || Object.keys(replay).length === 0) {
    el.textContent = '';
    el.className = 'tag';
    return;
  }
  if (replay.bit_exact) {
    el.textContent = `replay ${replay.matched}/${replay.total} bit-exact`;
    el.className = 'tag tag-pass';
  } else {
    const step = replay.divergence ? replay.divergence.step_index : '?';
    el.textContent = `replay diverged @ step ${step}`;
    el.className = 'tag tag-fail';
  }
}

// Boundary string values mirror `constants.py`'s BOUNDARY_V1 /
// OTEL_INGESTED_BOUNDARY / PROXY_BOUNDARY -- keep in sync if those are ever
// renamed. SLSA-style leveled trust (not a single verified/unverified
// boolean): a single-process tape is bit-exact-replay-verified; an
// OTel-ingested or proxy-recorded tape is forensic-only (documented
// non-bit-exact, see each module's docstring). `content_redacted` is a
// SEPARATE, orthogonal warning -- forensic-only, never fed into `digest()`,
// never a pass/fail input.
const _VERIFIED_BOUNDARY = 'single-process-asyncio-v1';

function renderProvenanceBadges(data) {
  const boundaryEl = document.getElementById('boundary-tag');
  const boundary = data.boundary || '';
  if (boundary === _VERIFIED_BOUNDARY) {
    boundaryEl.textContent = 'verified boundary';
    boundaryEl.className = 'tag tag-pass';
    boundaryEl.title = 'single-process, bit-exact-replay-verified determinism boundary';
  } else if (boundary) {
    boundaryEl.textContent = `forensic-only boundary (${escape(boundary)})`;
    boundaryEl.className = 'tag tag-warn';
    boundaryEl.title = 'recorded outside the full determinism boundary — not guaranteed bit-exact replay';
  } else {
    boundaryEl.textContent = '';
    boundaryEl.className = 'tag';
    boundaryEl.title = '';
  }

  const redactedEl = document.getElementById('redacted-tag');
  if (data.content_redacted) {
    redactedEl.textContent = 'content redacted';
    redactedEl.className = 'tag tag-redacted';
    redactedEl.title = 'forensic-only: redacted message content is not guaranteed bit-exact-replayable';
  } else {
    redactedEl.textContent = '';
    redactedEl.className = 'tag';
    redactedEl.title = '';
  }
}

function jumpToDivergence() {
  const divergence = DATA && DATA.replay && DATA.replay.divergence;
  if (divergence) selectExchange(divergence.step_index);
}

function renderBlame(data) {
  const blame = data.blame;
  if (!blame || Object.keys(blame).length === 0) return;
  const entries = Object.entries(blame).sort((a, b) => b[1].flip_rate - a[1].flip_rate);
  const headerHtml = `<div class="blame-header-row">
    <span style="width:20px">rank</span>
    <span style="flex:1">step</span>
    <span style="width:80px">bar</span>
    <span style="min-width:50px;text-align:right">flip</span>
  </div>`;
  const rowsHtml = entries.map(([step, info], rank) => {
    const rate = info.flip_rate;
    const isDecisive = rate >= 0.7;
    const pct = Math.round(rate * 100);
    const trustHtml = renderTrustFlags(info);
    const evidenceHtml = evidenceBadgeHtml(info);
    return `<div class="blame-row">
      <span class="blame-rank">${rank+1}</span>
      <div class="blame-info">
        <div class="blame-step">step-${step}${evidenceHtml}</div>
        <div class="blame-ci">95% CI [${info.ci_lo.toFixed(2)}, ${info.ci_hi.toFixed(2)}]</div>
        ${trustHtml}
      </div>
      <div class="blame-bar-wrap"><div class="blame-bar${isDecisive ? ' decisive' : ''}" style="width:${pct}%"></div></div>
      <div class="blame-rate${isDecisive ? ' decisive' : ''}">${pct}%</div>
    </div>`;
  }).join('');
  document.getElementById('blame-content').innerHTML = headerHtml + rowsHtml;
}

// Shepherd-style Slice vocabulary: 'selected' reuses
// blame.py's already-shipped FlipRateResult.responsible (the FDR-controlled
// responsible set); anything else -- including a legacy pre-trust-flags
// blame dict that lacks `responsible` entirely -- is 'support evidence',
// never silently unlabeled.
function evidenceBadgeHtml(info) {
  const selected = info.responsible === true;
  const cls = selected ? 'selected' : 'support';
  const label = selected ? 'selected' : 'support evidence';
  const title = selected
    ? "in blame's FDR-controlled responsible set"
    : "not in blame's FDR-controlled responsible set";
  return `<span class="evidence-badge ${cls}" title="${escapeAttr(title)}">${label}</span>`;
}

// 'external-anchor' entries: responsible=1 causal edges
// reachable via fork-promotion lineage (`store.causal_closure`) that belong
// to OTHER run_ids -- Shepherd's "causal parent outside the current slice's
// own content". Entries matching THIS run are already covered by
// `renderBlame`'s own rows above (badged selected/support evidence), so
// they're skipped here to avoid a duplicate/fabricated edge. Empty/absent
// closure renders nothing, matching `renderForkTree`'s established
// empty-state style (no container is added at all).
function renderExternalAnchors(data) {
  const closure = data.causal_closure || [];
  const external = closure.filter(e => e.run_id !== data.run_id);
  if (external.length === 0) return;
  const headerHtml = `<div class="blame-header-row"><span>external anchors (other runs' causal parents)</span></div>`;
  const rowsHtml = external.map(e => {
    const q = e.q_value != null ? ` · q=${Number(e.q_value).toFixed(3)}` : '';
    return `<div class="anchor-row">
      <span class="evidence-badge selected">external anchor</span>
      <span class="anchor-run">${escape(e.run_id)}</span> · step-${escape(String(e.step_index))}${q}
    </div>`;
  }).join('');
  document.getElementById('blame-content').insertAdjacentHTML('beforeend', headerHtml + rowsHtml);
}

function renderTrustFlags(info) {
  // Additive: older blame dicts (pre-trust-flags) only carry flip_rate/ci_lo/ci_hi.
  if (typeof info.divergence_rate !== 'number') return '';
  const divPct = Math.round(info.divergence_rate * 100);
  const undef = info.undefined !== undefined ? info.undefined : 0;
  const trials = info.trials !== undefined ? info.trials : (info.valid_trials || 0) + undef;
  const warn = info.trustworthy === false ? ' <span class="trust-warn">⚠ low-confidence</span>' : '';
  return `<div class="trust-flags">divergence ${divPct}% · undefined ${undef}/${trials}${warn}</div>`;
}

let _selected = -1;
function selectExchange(i) {
  if (!DATA || i < 0 || i >= DATA.exchanges.length) return;
  // Scoped to #timeline-content: an unscoped `[data-i="N"]` selector also
  // matches the scrubber tick with the same data-i (rendered into
  // #timeline-scrubber, which sits BEFORE #timeline-content in the DOM), so
  // querySelector's first-match-in-document-order semantics would toggle
  // .active on the tick instead of the exchange-item row -- the Timeline
  // list's selected-step highlight would never render. The tick's own
  // .active state is handled separately by updateScrubberPosition below.
  if (_selected >= 0) {
    document.querySelector(`#timeline-content [data-i="${_selected}"]`)?.classList.remove('active');
  }
  _selected = i;
  document.querySelector(`#timeline-content [data-i="${i}"]`)?.classList.add('active');
  const ex = DATA.exchanges[i];
  const reqJson = syntaxHighlight(JSON.stringify(ex.request || {}, null, 2));
  const respJson = syntaxHighlight(JSON.stringify(ex.response_preview || {}, null, 2));
  // Rewind-to-step: prev/next step through recorded exchanges from here.
  const navHtml = `<div class="detail-nav">
      <button class="nav-btn" onclick="selectExchange(${i - 1})" ${i <= 0 ? 'disabled' : ''}>‹ prev</button>
      <span>exchange ${i} / ${DATA.exchanges.length - 1}</span>
      <button class="nav-btn" onclick="selectExchange(${i + 1})" ${i >= DATA.exchanges.length - 1 ? 'disabled' : ''}>next ›</button>
    </div>`;
  document.getElementById('detail-content').innerHTML = navHtml + `
    <div class="detail-section">
      <h3>Request (exchange ${i})</h3>
      <pre>${reqJson}</pre>
    </div>
    <div class="detail-section">
      <h3>Response</h3>
      <pre>${respJson}</pre>
      <div id="fork-ui"></div>
    </div>` + renderDivergencePanel(i);
  updateScrubberPosition(i);
  renderForkUi(i);
}

// ── click-to-fork inline UI ──────────────────────────────────────────────────
// Live-mode-only: a static report file structurally cannot spend money, so
// it keeps the same honest 'live-mode-only' text affordance renderForkTree's
// branch clicks already use for the analogous case.
function renderForkUi(i) {
  const el = document.getElementById('fork-ui');
  if (!el) return;
  if (window.__TRACEFORK_SERVER_URL__ === undefined) {
    el.innerHTML = '<p class="detail-empty">live-mode-only: open via \'tracefork serve\' to edit &amp; fork this response</p>';
    return;
  }
  el.innerHTML = `<button class="nav-btn" onclick="startForkEdit(${i})">Edit &amp; Fork</button>
    <div id="fork-edit-${i}"></div>`;
}

function startForkEdit(i) {
  const container = document.getElementById(`fork-edit-${i}`);
  if (!container) return;
  const ex = DATA.exchanges[i];
  const responseText = JSON.stringify(ex.response_preview || {}, null, 2);
  container.innerHTML = `
    <textarea id="fork-response-textarea" class="fork-textarea" rows="8">${escape(responseText)}</textarea>
    <div class="fork-row">
      <input type="text" id="fork-agent-name" class="nav-btn fork-textarea" placeholder="allowlisted agent name (name=module:fn on the server)">
    </div>
    <div class="fork-row">
      <button class="nav-btn" onclick="getForkEstimate(${i})">Get cost estimate</button>
      <span id="fork-estimate-result"></span>
    </div>`;
}

function _forkResponseBytesBase64() {
  const textarea = document.getElementById('fork-response-textarea');
  return btoa(unescape(encodeURIComponent(textarea.value)));
}

async function _postFork(path, i, extra) {
  const agentName = document.getElementById('fork-agent-name').value;
  const runId = new URLSearchParams(location.search).get('run_id');
  const url = window.__TRACEFORK_SERVER_URL__;
  const body = Object.assign(
    { agent_name: agentName, step: i, mutated_response_b64: _forkResponseBytesBase64() },
    extra || {}
  );
  const resp = await fetch(`${url}/api/run/${runId}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const payload = await resp.json().catch(() => ({ detail: `server ${resp.status}` }));
  if (!resp.ok) throw new Error(payload.detail || `server ${resp.status}`);
  return payload;
}

async function getForkEstimate(i) {
  const resultEl = document.getElementById('fork-estimate-result');
  try {
    const data = await _postFork('/fork/estimate', i);
    resultEl.innerHTML = `$${Number(data.est_usd).toFixed(4)} — <button class="nav-btn" onclick="confirmFork(${i})">Confirm &amp; Fork</button>`;
  } catch (e) {
    resultEl.innerHTML = `<span class="error">${escape(e.message)}</span>`;
  }
}

async function confirmFork(i) {
  const resultEl = document.getElementById('fork-estimate-result');
  try {
    const branch = await _postFork('/fork', i, { confirm: true });
    resultEl.innerHTML = `forked → branch ${escape(branch.branch_id)}`;
    // Re-fetch the run so the new branch shows up in the fork tree.
    const runId = new URLSearchParams(location.search).get('run_id');
    const url = window.__TRACEFORK_SERVER_URL__;
    const runResp = await fetch(`${url}/api/run/${runId}`);
    if (runResp.ok) {
      DATA = await runResp.json();
      renderForkTree(DATA);
    }
  } catch (e) {
    resultEl.innerHTML = `<span class="error">${escape(e.message)}</span>`;
  }
}

// ── Timeline scrubber ──────────────────────────────────────────────────────
// Play/step/slider/click-to-jump UI wired to exchange INDEX -- the only
// ordering axis the pipeline records today (`Tape.exchanges` is a bare
// (req_bytes, resp_bytes) tuple list; `report.py`'s `_tape_to_data` never
// stamps a per-exchange timestamp). `tickPosition` already prefers an
// optional `ex.timestamp` field the moment a future recorder adds one, with
// no further UI change needed then.
let _scrubberTimer = null;

function tickPosition(ex, i, n) {
  const timestamps = DATA ? DATA.exchanges.map(e => e && e.timestamp) : [];
  const hasTimestamps = timestamps.length > 0 && timestamps.every(t => typeof t === 'number');
  if (hasTimestamps) {
    const lo = Math.min(...timestamps), hi = Math.max(...timestamps);
    if (hi > lo) return (ex.timestamp - lo) / (hi - lo);
  }
  return n <= 1 ? 0 : i / (n - 1);
}

function renderScrubber(data) {
  const el = document.getElementById('timeline-scrubber');
  const n = data.exchanges.length;
  if (n === 0) {
    el.innerHTML = '';
    return;
  }
  const max = Math.max(0, n - 1);
  const ticksHtml = data.exchanges.map((ex, i) => {
    const pct = (tickPosition(ex, i, n) * 100).toFixed(2);
    return `<div class="scrubber-tick" data-i="${i}" style="left:${pct}%" onclick="selectExchange(${i})" title="exchange ${i}"></div>`;
  }).join('');
  el.innerHTML = `
    <div class="scrubber-controls">
      <button class="scrubber-play-btn" id="scrubber-play-btn" onclick="playPause()">▶ play</button>
      <input type="range" id="scrubber-slider" class="scrubber-slider" min="0" max="${max}" value="0" step="1"
             oninput="selectExchange(Number(this.value))" ${n <= 1 ? 'disabled' : ''}>
    </div>
    <div class="scrubber-track" id="scrubber-ticks">${ticksHtml}</div>`;
}

function updateScrubberPosition(i) {
  const slider = document.getElementById('scrubber-slider');
  if (slider) slider.value = String(i);
  document.querySelectorAll('.scrubber-tick').forEach(t => {
    t.classList.toggle('active', Number(t.getAttribute('data-i')) === i);
  });
}

function stepScrubber(delta) {
  if (!DATA) return;
  const next = _selected + delta;
  if (next < 0 || next >= DATA.exchanges.length) {
    playPause(true); // reached an end -- stop instead of wrapping
    return;
  }
  selectExchange(next);
}

function playPause(forceStop) {
  const btn = document.getElementById('scrubber-play-btn');
  if (_scrubberTimer || forceStop) {
    clearInterval(_scrubberTimer);
    _scrubberTimer = null;
    if (btn) btn.textContent = '▶ play';
    return;
  }
  if (btn) btn.textContent = '⏸ pause';
  _scrubberTimer = setInterval(() => stepScrubber(1), 800);
}

function renderDivergencePanel(i) {
  const divergence = (DATA.replay && DATA.replay.divergence) || null;
  if (!divergence || divergence.step_index !== i) return '';
  const diag = divergence.diag;
  let body = `<p>${escape(divergence.message || '')}</p>`;
  if (diag) {
    const noteClass = diag.is_real_divergence ? 'real' : 'tolerated';
    const noteText = diag.is_real_divergence ? 'real divergence' : 'tolerated / non-semantic';
    body += `<p><span class="diverge-note ${noteClass}">${noteText}</span> · matcher '${escape(diag.matcher_name)}'</p>`;
    if (diag.normalized_fields && diag.normalized_fields.length) {
      body += `<p class="trust-flags">normalized (excluded from comparison): ${diag.normalized_fields.map(escape).join(', ')}</p>`;
    }
    if (diag.field_diffs && diag.field_diffs.length) {
      const rows = diag.field_diffs.map(d => `<tr>
          <td class="diff-path">${escape(d.path)}</td>
          <td class="diff-recorded">${escape(JSON.stringify(d.recorded))}</td>
          <td class="diff-live">${escape(JSON.stringify(d.live))}</td>
        </tr>`).join('');
      body += `<table class="diff-table"><thead><tr><th>field</th><th>recorded</th><th>live</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      body += `<p class="trust-flags">no field-level diff available</p>`;
    }
  }
  return `<div class="detail-section">
      <h3>Divergence Diagnostic</h3>
      ${body}
    </div>`;
}

function syntaxHighlight(json) {
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      m => {
        let cls = 'number';
        if (/^"/.test(m)) cls = /:$/.test(m) ? 'key' : 'string';
        return `<span class="${cls}">${m}</span>`;
      });
}

function escape(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Same escaping as `escape()` plus `"` — required when the value lands inside
// a double-quoted HTML attribute (e.g. `data-branch-id="..."`) rather than
// text content, so a branch_id/digest containing a quote can't break out of
// the attribute.
function escapeAttr(s) { return escape(String(s)).replace(/"/g, '&quot;'); }

// ── Panel 4 — Fork Tree ────────────────────────────────────────────────────
// Git-graph-style row layout: one row per branch, ranked by divergence_step,
// each edging straight up to the root run. `branches` is the flat summary
// `TapeStore.list_branches` returns (branch_id/divergence_step/mutation_desc/
// created_at/branch_digest) -- a true DAG (parent_id + extra caused_by edges,
// multi-level fork-of-fork chains) is future scope; this data shape is one
// run's direct branches, so a single-level star is the honest rendering of
// what's actually available today.
function renderForkTree(data) {
  const el = document.getElementById('forktree-content');
  const branches = data.branches || [];
  if (branches.length === 0) {
    el.innerHTML = '<div class="forktree-empty">no forked branches</div>';
    return;
  }
  // Causal heatmap lookups: data.causal_edges is the flat
  // `store.causal_edges_for_run` shape (blame + shapley rows, see
  // `_edge_row_to_dict`) -- split by method and indexed by step_index so a
  // branch's divergence_step can be cross-referenced with no second query.
  // Empty/absent causal_edges (the default) means every lookup below misses,
  // so a report with no persisted blame/shapley data renders byte-identical
  // to before this feature existed.
  const causalEdges = data.causal_edges || [];
  const blameByStep = {};
  const shapleyByStep = {};
  causalEdges.forEach(e => {
    if (e.method === 'blame') blameByStep[e.step_index] = e;
    else if (e.method === 'shapley') shapleyByStep[e.step_index] = e;
  });
  const sorted = [...branches].sort((a, b) => (a.divergence_step ?? 0) - (b.divergence_step ?? 0));
  const rowH = 48;
  const width = 240;
  const rootX = 26, rootY = 22;
  const height = rootY + rowH * sorted.length + 24;
  let svg = `<svg width="${width}" height="${height}" class="forktree-svg">`;
  svg += `<circle cx="${rootX}" cy="${rootY}" r="6" class="forktree-node forktree-root"></circle>`;
  svg += `<text x="${rootX + 14}" y="${rootY + 4}" class="forktree-label forktree-root-label">run</text>`;
  sorted.forEach((b, i) => {
    const y = rootY + rowH * (i + 1);
    const digestShort = (b.branch_digest || '').slice(0, 8);
    const step = b.divergence_step !== undefined && b.divergence_step !== null ? b.divergence_step : '?';
    const blameEdge = blameByStep[b.divergence_step];
    const shapleyEdge = shapleyByStep[b.divergence_step];
    let nodeClass = 'forktree-node';
    const tooltipParts = [];
    if (blameEdge && blameEdge.responsible) {
      nodeClass += ' forktree-node-responsible';
      tooltipParts.push(`q=${blameEdge.q_value != null ? Number(blameEdge.q_value).toFixed(3) : '?'} responsible`);
    }
    if (shapleyEdge && shapleyEdge.necessity) {
      nodeClass += ' forktree-node-necessary';
      tooltipParts.push(`necessary (shapley=${shapleyEdge.shapley_value != null ? Number(shapleyEdge.shapley_value).toFixed(3) : '?'})`);
    }
    if (shapleyEdge && shapleyEdge.sufficiency) {
      nodeClass += ' forktree-node-sufficient';
      tooltipParts.push('sufficient');
    }
    const tooltip = tooltipParts.length ? `<title>${escape(tooltipParts.join(' · '))}</title>` : '';
    svg += `<line x1="${rootX}" y1="${rootY}" x2="${rootX}" y2="${y}" class="forktree-edge"></line>`;
    svg += `<circle cx="${rootX}" cy="${y}" r="5" class="${nodeClass}" data-branch-id="${escapeAttr(b.branch_id)}">${tooltip}</circle>`;
    svg += `<text x="${rootX + 14}" y="${y - 6}" class="forktree-label">step ${escape(String(step))}${digestShort ? ' · ' + escape(digestShort) : ''}</text>`;
    svg += `<text x="${rootX + 14}" y="${y + 10}" class="forktree-desc">${escape(b.mutation_desc || '')}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  el.querySelectorAll('[data-branch-id]').forEach(node => {
    node.addEventListener('click', () => onForkNodeClick(node.getAttribute('data-branch-id')));
  });
}

function onForkNodeClick(branchId) {
  const detailEl = document.getElementById('detail-content');
  // Static reports generated with the run_id/store path bake in every
  // branch's full delta-tape detail -- render it directly, no
  // fetch, before falling back to a live server or the static placeholder.
  const embedded = DATA.branch_details && DATA.branch_details[branchId];
  if (embedded) {
    if (embedded.error === 'fork_point_drift') {
      detailEl.innerHTML = `<div class="error">branch ${escape(branchId)}: fork point drift — ${escape(embedded.detail || '')}</div>`;
      return;
    }
    detailEl.innerHTML = `<div class="detail-section">
      <h3>Branch ${escape(branchId)}</h3>
      <p>diverged at step ${escape(String(embedded.divergence_step))}</p>
      <p>${escape(embedded.mutation_desc || '')}</p>
      <p class="trust-flags">digest ${escape(embedded.branch_digest || '')}</p>
    </div>`;
    return;
  }
  if (window.__TRACEFORK_SERVER_URL__ === undefined) {
    // Static mode with no embedded branch_details (e.g. a --tape-loaded
    // report with no store): an honest 'live-mode-only' affordance rather
    // than a silently-empty click.
    detailEl.innerHTML = `<div class="detail-empty">branch ${escape(branchId)} — live-mode-only: open via 'tracefork serve' to inspect its delta tape</div>`;
    return;
  }
  const url = window.__TRACEFORK_SERVER_URL__;
  fetch(`${url}/api/branch/${branchId}`)
    .then(resp => {
      if (!resp.ok) throw new Error(`server ${resp.status}: branch not found`);
      return resp.json();
    })
    .then(branch => {
      detailEl.innerHTML = `<div class="detail-section">
        <h3>Branch ${escape(branchId)}</h3>
        <p>diverged at step ${escape(String(branch.divergence_step))}</p>
        <p>${escape(branch.mutation_desc || '')}</p>
        <p class="trust-flags">digest ${escape(branch.branch_digest || '')}</p>
      </div>`;
    })
    .catch(e => {
      detailEl.innerHTML = `<div class="error">${escape(e.message)}</div>`;
    });
}

// ── Panel 5 — Cost Profile ─────────────────────────────────────────────────
// Per-model/per-tool cost dashboard from `data.cost_profile` (the shape
// `cost_profile.cost_profile_to_dict` returns). Per-tool cost is an honest
// over-count for multi-tool exchanges (Anthropic bills per-exchange, not
// per-tool-call) -- see `cost_profile.py`'s module docstring.
function renderCostProfile(data) {
  const el = document.getElementById('cost-content');
  const profile = data.cost_profile || {};
  const byModel = profile.by_model || [];
  const byTool = profile.by_tool || [];
  if (byModel.length === 0 && byTool.length === 0) {
    el.innerHTML = '<div class="cost-empty">no cost data</div>';
    return;
  }
  let html = '<div class="cost-section"><h3>By model</h3></div>';
  html += byModel.map(m => `<div class="cost-row">
      <div>
        <div class="cost-name">${escape(m.model)}</div>
        <div class="cost-meta">${m.n_exchanges} exchange(s) · ${m.input_tokens} in / ${m.output_tokens} out tok</div>
      </div>
      <div class="cost-usd">$${Number(m.total_cost_usd).toFixed(4)}</div>
    </div>`).join('');
  if (byTool.length > 0) {
    html += '<div class="cost-section"><h3>By tool</h3></div>';
    html += byTool.map(t => `<div class="cost-row">
        <div>
          <div class="cost-name">${escape(t.tool_name)}</div>
          <div class="cost-meta">${t.n_calls} call(s)</div>
        </div>
        <div class="cost-usd">$${Number(t.total_cost_usd).toFixed(4)}</div>
      </div>`).join('');
  }
  html += `<div class="cost-total"><span>total</span><span>$${Number(profile.total_cost_usd || 0).toFixed(4)}</span></div>`;
  el.innerHTML = html;
}

// ── boot ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    DATA = await loadData();
    document.getElementById('run-meta').textContent = [
      DATA.agent_name || 'unknown agent',
      `${DATA.exchanges.length} exchanges`,
      DATA.created_at || null,
    ].filter(Boolean).join(' · ');
    renderTimeline(DATA);
    renderScrubber(DATA);
    renderBlame(DATA);
    renderExternalAnchors(DATA);
    renderReplayBadge(DATA);
    renderProvenanceBadges(DATA);
    renderForkTree(DATA);
    renderCostProfile(DATA);
    if (DATA.exchanges.length > 0) {
      // OTel exemplar back-link: a redirect from
      // /otel/{trace_id}/{span_id} lands on /?run_id=X&step=N -- auto-select
      // exchange N instead of the hardcoded 0. Absent/invalid param is
      // byte-identical to before (clamped into range, default 0).
      const stepParam = new URLSearchParams(location.search).get('step');
      let initialStep = 0;
      if (stepParam !== null) {
        const parsed = Number(stepParam);
        if (Number.isInteger(parsed)) {
          initialStep = Math.min(Math.max(parsed, 0), DATA.exchanges.length - 1);
        }
      }
      selectExchange(initialStep);
    }
  } catch (e) {
    document.getElementById('timeline-content').innerHTML = `<div class="error">${e.message}</div>`;
  }
})();
</script>
