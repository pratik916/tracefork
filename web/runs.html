<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Content-Security-Policy: no external script/style/
     img/connect origin is allowed anywhere -- this is a single, dependency-
     free HTML file, its app code is inline, so 'unsafe-inline' on
     script/style is the one necessary exception, not a carve-out for
     anything beyond what this file's own architecture already requires.
     server.py sends the equivalent policy (plus frame-ancestors, which
     browsers ignore in a <meta> tag -- so it's omitted here) as a response
     header when serving this same template live -- see its
     `CONTENT_SECURITY_POLICY` constant. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tracefork — runs</title>
<!-- TF:tokens -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* color tokens — dark theme (default, GitHub-dark) */
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #838b95; --green: #3fb950;
    --blue: #58a6ff; --orange: #f0883e; --purple: #d2a8ff;
    --red: #f85149; --yellow: #e3b341;
    /* semantic badge backgrounds (tags, blame/shapley/evidence badges, notes) */
    --badge-pass-bg: #1a3a1a; --badge-fail-bg: #3a1a1a;
    --badge-info-bg: #1a2a3a; --badge-warn-bg: #3a3010;
    --badge-redacted-bg: #3a2a10;
    /* type tokens — --font-ui for chrome, --font-mono for code/data */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial,
      sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --text-xs: 11px; --text-sm: 12px; --text-md: 13px; --text-lg: 15px;
    /* spacing scale, radius, focus ring */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    --radius: 6px;
    --focus-ring: 2px solid var(--blue);
    /* tells the UA to render native controls (range sliders, scrollbars,
       form-field chrome) in dark UI, matching this theme -- overridden to
       'light' below when [data-theme="light"] is active */
    color-scheme: dark;
  }
  [data-theme="light"] {
    /* light theme (GitHub-light-inspired) — stamped on <html> by the theme boot */
    --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --green: #1a7f37;
    --blue: #0969da; --orange: #bc4c00; --purple: #8250df;
    --red: #d1242f; --yellow: #9a6700;
    --badge-pass-bg: #dafbe1; --badge-fail-bg: #ffebe9;
    --badge-info-bg: #ddf4ff; --badge-warn-bg: #fff8c5;
    --badge-redacted-bg: #fff1e5;
    color-scheme: light;
  }
  :focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: var(--text-md); }
  /* Skip link: the first focusable element in the document, off-screen
     until it receives keyboard focus. */
  .skip-link { position: absolute; left: -9999px; top: 0; z-index: 100; background: var(--surface);
               color: var(--text); padding: 8px 14px; border: 1px solid var(--border);
               border-radius: 0 0 4px 0; text-decoration: none; font-size: var(--text-sm); }
  .skip-link:focus { left: 0; }
  /* Screen-reader-only heading text: keeps the h1 -> h2 hierarchy correct
     without a redundant visible "All runs" label right under the h1. */
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: var(--text-lg); color: var(--green); }
  header .sub { color: var(--muted); font-size: var(--text-xs); }
  .theme-toggle { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text);
                  font-family: inherit; font-size: var(--text-sm); padding: 1px 7px; cursor: pointer;
                  border-radius: 3px; line-height: 1.3; }
  .theme-toggle:hover { border-color: var(--blue); }

  /* App bar cross-nav — shared structure with report.html so the three
     report surfaces are reachable from one another, not islands. */
  .app-nav { display: flex; align-items: center; gap: 10px; }
  .app-nav-link { color: var(--muted); font-size: var(--text-xs); text-decoration: none;
                   padding: 2px 5px; border-radius: 3px; }
  .app-nav-link:hover, .app-nav-link:focus-visible { color: var(--text); text-decoration: underline; }
  .app-nav-link[aria-current="page"] { color: var(--text); font-weight: bold; }

  .container { padding: 20px; max-width: 960px; margin: 0 auto; }
  /* Wide content scrolls inside its own container -- the page body itself
     never scrolls horizontally, even with a long run_id/agent_name. */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: var(--text-sm); }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; background: var(--surface); }
  tr:hover td { background: var(--surface); }
  td.run-id-cell a { color: var(--blue); text-decoration: none; font-family: var(--font-mono); }
  td.run-id-cell a:hover { text-decoration: underline; }
  .runs-empty { padding: 40px; color: var(--muted); text-align: center; }
  .loading { padding: 40px; color: var(--muted); text-align: center; }
  .error { padding: 20px; color: var(--red); }

  /* ── Responsive breakpoints (same values as report.html/session_report.html) ── */
  @media (max-width: 860px) {
    .container { padding: 14px; }
  }
  @media (max-width: 560px) {
    header { flex-wrap: wrap; row-gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); }
    .container { padding: var(--sp-3); }
    th, td { padding: 6px 8px; }
  }
</style>
<!-- TF:theme-boot -->
<script>
// Zero-FOUC theme boot: resolve the persisted theme (localStorage
// "tracefork-theme", JSON-encoded by the toggle) — or, on first visit,
// prefers-color-scheme — and stamp it on <html data-theme> before first
// paint. Default dark. Never throws (file:// / privacy modes can make
// localStorage or matchMedia unavailable).
(function () {
  var theme = 'dark';
  try {
    var raw = localStorage.getItem('tracefork-theme');
    if (raw !== null) {
      try { theme = JSON.parse(raw); } catch (e) { theme = raw; }
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      theme = 'light';
    }
  } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') theme = 'dark';
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>
<a class="skip-link" href="#runs-main">Skip to main content</a>
<header>
  <h1>tracefork</h1>
  <nav class="app-nav" aria-label="tracefork pages">
    <a class="app-nav-link" id="nav-runs-link" href="/runs" aria-current="page">Runs</a>
  </nav>
  <span class="sub">all runs</span>
  <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="toggle color theme" title="toggle color theme">◐</button>
</header>
<main class="container" id="runs-main" tabindex="-1">
  <h2 class="visually-hidden">All runs</h2>
  <div id="runs-content"><div class="loading">loading…</div></div>
</main>

<script>
// ── data source ──────────────────────────────────────────────────────────
// This page only ever serves same-origin, live-mode data (see server.py's
// GET /runs route) -- unlike report.html there is no static-snapshot mode,
// so it always fetches /api/runs directly.
async function loadRuns() {
  const resp = await fetch('/api/runs');
  if (!resp.ok) throw new Error(`server ${resp.status}: could not list runs`);
  return resp.json();
}

function escape(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── theme toggle ─────────────────────────────────────────────────────────
// Same contract as report.html's toggle: flips <html data-theme>, persists the
// choice (JSON-encoded localStorage "tracefork-theme", the key the head boot
// script reads), and re-syncs the header button. ◐ is the pre-JS glyph.
function toggleTheme() {
  var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('tracefork-theme', JSON.stringify(next)); } catch (e) { /* storage unavailable */ }
  _syncThemeToggle();
}
function _syncThemeToggle() {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var light = document.documentElement.dataset.theme === 'light';
  btn.textContent = light ? '🌙' : '☀';
  var label = light ? 'switch to dark theme' : 'switch to light theme';
  btn.setAttribute('aria-label', label);
  btn.title = label;
}
_syncThemeToggle();

// ── render ───────────────────────────────────────────────────────────────
// Columns: run_id/agent_name/created_at only (server-side pre-sorted
// newest-first by TapeStore.list_runs) -- a richer flip-rate column needs
// per-run blame aggregation and is a separate, larger follow-up.
function renderRuns(runs) {
  const el = document.getElementById('runs-content');
  if (!runs || runs.length === 0) {
    el.innerHTML = '<div class="runs-empty">no runs yet</div>';
    return;
  }
  const rowsHtml = runs.map(r => `<tr>
      <td class="run-id-cell"><a href="/?run_id=${encodeURIComponent(r.run_id)}">${escape(r.run_id)}</a></td>
      <td>${escape(r.agent_name || '(unknown agent)')}</td>
      <td>${escape(r.created_at || '')}</td>
    </tr>`).join('');
  el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>run_id</th><th>agent</th><th>created_at</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`;
}

// ── boot ─────────────────────────────────────────────────────────────────
(async () => {
  try {
    const runs = await loadRuns();
    renderRuns(runs);
  } catch (e) {
    document.getElementById('runs-content').innerHTML = `<div class="error">${escape(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
